<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>나만의 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
--bg: #F5F2EC;
--bg2: #EDEAE2;
--surface: #FAFAF7;
--border: #D8D4C8;
--border2: #C8C4B8;
--text: #1A1814;
--text2: #6B6760;
--text3: #9A9690;
--accent: #2D4A3E;
--accent2: #3D6B5A;
--accent-light: #E8F0EC;
--c-fixed: #7B9EC4;
--c-var: #C9906A;
--c-invest: #9B7DC4;
--c-anger: #D97B7B;
--green: #2D6A4F;
--amber: #B5621A;
--red: #B03030;
--sans: 'Noto Sans KR', sans-serif;
--radius: 4px;
--radius-lg: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
body { min-height: 100vh; }
.wrapper { max-width: 780px; margin: 0 auto; padding: 0 1.5rem 4rem; }
header { padding: 2.5rem 0 2rem; border-bottom: 1px solid var(--border); margin-bottom: 2rem; display: flex; align-items: flex-end; justify-content: space-between; }
.logo { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
.logo span { color: var(--accent); }
.today-lbl { font-size: 12px; color: var(--text3); }
.tabs { display: flex; margin-bottom: 2rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tab { padding: 10px 16px; font-family: var(--sans); font-size: 14px; cursor: pointer; border: none; background: none; color: var(--text2); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.2s; }
.tab:hover { color: var(--text); }
.tab[data-tab="monthly"] { color: var(--text2); }
.tab[data-tab="monthly"]:hover { color: #16A34A; }
.tab[data-tab="monthly"].active { color: #16A34A; border-bottom-color: #16A34A; border-bottom-width: 3px; font-weight: 600; }
.tab[data-tab="input"] { color: var(--text2); }
.tab[data-tab="input"]:hover { color: #0284C7; }
.tab[data-tab="input"].active { color: #0284C7; border-bottom-color: #0284C7; border-bottom-width: 3px; font-weight: 600; }
.tab[data-tab="list"] { color: var(--text2); }
.tab[data-tab="list"]:hover { color: #D97706; }
.tab[data-tab="list"].active { color: #D97706; border-bottom-color: #D97706; border-bottom-width: 3px; font-weight: 600; }
.tab[data-tab="calendar"] { color: var(--text2); }
.tab[data-tab="calendar"]:hover { color: #0891B2; }
.tab[data-tab="calendar"].active { color: #0891B2; border-bottom-color: #0891B2; border-bottom-width: 3px; font-weight: 600; }
.tab[data-tab="retro"] { color: var(--text2); }
.tab[data-tab="retro"]:hover { color: #E11D48; }
.tab[data-tab="retro"].active { color: #E11D48; border-bottom-color: #E11D48; border-bottom-width: 3px; font-weight: 600; }
.section { display: none; }
.section.active { display: block; }
.cat-badge { display: inline-flex; align-items: center; gap: 6px; }
.cat-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.cat-dot.fixed { background: var(--c-fixed); }
.cat-dot.var { background: var(--c-var); }
.cat-dot.invest{ background: var(--c-invest); }
.summary-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 2rem; }
.sum-block { background: var(--surface); padding: 14px 18px; }
.sum-block .lbl { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }
.sum-block .val { font-size: 15px; font-weight: 500; color: var(--text); }
.sum-block .sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
.form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1.5rem; }
.form-card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); margin-bottom: 1.25rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; }
.field input, .field select, .field textarea {
font-family: var(--sans); font-size: 14px; background: var(--bg); border: 1px solid var(--border);
border-radius: var(--radius); padding: 8px 10px; color: var(--text); outline: none; transition: border-color 0.2s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: none; height: 64px; line-height: 1.5; }
.mb1 { margin-bottom: 1rem; }
.values-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--accent-light); border-radius: var(--radius); border: 1px solid #C8DDD4; margin-bottom: 1.25rem; }
.values-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.values-row label { font-size: 13px; color: var(--accent); cursor: pointer; }
.btn-primary { width: 100%; padding: 11px; font-family: var(--sans); font-size: 14px; font-weight: 500; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); cursor: pointer; transition: background 0.2s; }
.btn-primary:hover { background: var(--accent2); }
.list-controls { display: flex; gap: 10px; align-items: center; margin-bottom: 1.25rem; justify-content: space-between; }

.filter-wrap { display: flex; gap: 8px; }

.month-nav { display: flex; align-items: center; margin-bottom: 2rem; }
.month-nav button { background: var(--surface); border: 1px solid var(--border); padding: 7px 14px; cursor: pointer; font-size: 16px; color: var(--text2); transition: background 0.2s; }
.month-nav button:first-child { border-radius: var(--radius) 0 0 var(--radius); border-right: none; }
.month-nav button:last-child { border-radius: 0 var(--radius) var(--radius) 0; border-left: none; }
.month-nav button:hover { background: var(--bg2); }
.month-title { flex: 1; text-align: center; font-size: 17px; font-weight: 500; color: var(--text); border: 1px solid var(--border); padding: 7px 0; background: var(--surface); }
.cat-section { margin-bottom: 1.75rem; }
.cat-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.cat-head-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.cat-head-amt { font-size: 13px; color: var(--text2); }
.cat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.cat-row-label { font-size: 12px; color: var(--text2); width: 150px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-bg { flex: 1; height: 5px; background: var(--bg2); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.cat-row-amt { font-size: 11px; color: var(--text3); min-width: 70px; text-align: right; }
.values-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem 1.5rem; margin-top: 2rem; display: flex; gap: 1.5rem; align-items: center; }
.v-circle { width: 72px; height: 72px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
.v-pct { font-size: 22px; font-weight: 500; line-height: 1; }
.v-lbl { font-size: 10px; color: var(--text3); margin-top: 2px; }
.v-text { font-size: 13px; color: var(--text2); line-height: 1.7; }
.v-text strong { font-size: 14px; color: var(--text); font-weight: 500; display: block; margin-bottom: 4px; }
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 9px 22px; border-radius: 99px; font-size: 13px; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; }
.export-btn { font-family: var(--sans); font-size: 13px; color: var(--text3); background: none; border: 1px solid var(--border); border-radius: var(--radius); padding: 5px 12px; cursor: pointer; transition: all 0.2s; }
.export-btn:hover { background: var(--bg2); color: var(--text); }
@media (max-width: 560px) {
.grid2 { grid-template-columns: 1fr; }
.summary-strip { grid-template-columns: 1fr; }
.cat-row-label { width: 90px; }
.pie-charts-grid { grid-template-columns: 1fr !important; }
.pie-charts-grid > div:last-child { border-left: none !important; padding-left: 0 !important; border-top: 1px solid var(--border); padding-top: 1.5rem; }
}
.income-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; }
.income-card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); margin-bottom: 1rem; }
.income-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.income-row input { font-family: var(--sans); font-size: 13px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; color: var(--text); outline: none; transition: border-color 0.2s; flex: 1; }
.income-row input:focus { border-color: var(--accent); }
.income-row .btn-add-income { padding: 7px 14px; font-size: 13px; font-family: var(--sans); background: var(--accent-light); color: var(--accent); border: 1px solid #C8DDD4; border-radius: var(--radius); cursor: pointer; white-space: nowrap; transition: background 0.2s; }
.income-row .btn-add-income:hover { background: #d4e8de; }
.income-list { display: flex; flex-direction: column; gap: 5px; }
.income-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: var(--bg); border-radius: var(--radius); font-size: 13px; }
.income-item .i-desc { color: var(--text2); flex: 1; }
.income-item .i-amt { font-weight: 500; color: var(--green); margin-right: 10px; }
.income-item .i-del { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 15px; transition: color 0.2s; }
.income-item .i-del:hover { color: var(--red); }
.income-total { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text2); }
.income-total strong { font-size: 15px; color: var(--green); }
.cal-nav { display: flex; align-items: center; margin-bottom: 1.5rem; }
.cal-nav button { background: var(--surface); border: 1px solid var(--border); padding: 7px 14px; cursor: pointer; font-size: 16px; color: var(--text2); transition: background 0.2s; }
.cal-nav button:first-child { border-radius: var(--radius) 0 0 var(--radius); border-right: none; }
.cal-nav button:last-child { border-radius: 0 var(--radius) var(--radius) 0; border-left: none; }
.cal-nav button:hover { background: var(--bg2); }
.cal-title { flex: 1; text-align: center; font-size: 17px; font-weight: 500; color: var(--text); border: 1px solid var(--border); padding: 7px 0; background: var(--surface); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-weekday { text-align: center; font-size: 11px; font-weight: 600; color: var(--text3); padding: 4px 0 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.cal-weekday:first-child { color: #C0625A; }
.cal-weekday:last-child { color: #5B7EC0; }
.cal-cell { aspect-ratio: 1; border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: default; position: relative; border: 1px solid transparent; transition: border-color 0.15s; }
.cal-cell.has-record { background: var(--surface); border-color: var(--border); cursor: pointer; }
.cal-cell.has-record:hover { border-color: var(--border2); }
.cal-cell.is-today .cal-date { background: var(--accent); color: #fff; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }

.cal-cell.sat .cal-date { color: #5B7EC0; }
.cal-cell.other-month { opacity: 0.25; }
.cal-date { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1; }
.cal-dots { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; max-width: 47px; margin: 0 auto; }
.cal-dot-item { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
.cal-total { font-size: 10px; color: var(--text3); margin-top: 1px; }
.cal-legend { display: flex; gap: 16px; margin-top: 1.25rem; justify-content: center; }
.cal-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text3); }
.cal-dot { width: 8px; height: 8px; border-radius: 50%; }
.cal-dot.has-entry { background: var(--accent); }

.cal-dot.today-dot { background: var(--accent); outline: 2px solid var(--accent-light); }
.cal-popup { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; margin-top: 1.25rem; }
.cal-popup-date { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

.cal-popup-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.cal-popup-item:last-child { border-bottom: none; }
.cal-popup-stripe { width: 3px; height: 28px; border-radius: 2px; flex-shrink: 0; }
.cal-popup-info { flex: 1; }
.cal-popup-desc { font-size: 13px; font-weight: 500; color: var(--text); }
.cal-popup-sub { font-size: 11px; color: var(--text3); margin-top: 1px; }
.cal-popup-amt { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:1000; align-items:center; justify-content:center; }
.modal-overlay.open { display:flex; }

.btn-save:hover { background:var(--accent2); }
.btn-cancel { padding:10px 18px; font-family:var(--sans); font-size:14px; background:none; color:var(--text2); border:1px solid var(--border); border-radius:var(--radius); cursor:pointer; }

.pr-month-nav button:first-child { border-radius: var(--radius) 0 0 var(--radius); border-right: none; }
.pr-month-nav button:last-child { border-radius: 0 var(--radius) var(--radius) 0; border-left: none; }
.pr-month-nav button:hover { background: var(--bg2); }
.pr-month-title { flex: 1; text-align: center; font-size: 17px; font-weight: 500; color: var(--text); border: 1px solid var(--border); padding: 7px 0; background: var(--surface); }

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>

// ─── 데이터 정의 ─────────────────────────────────────────────
// ✅ 변경: 변동비 소분류에 🏥 건강/의료, ✈️ 여행 추가
const CAT_MAP = {
"고정비": ["🏡 주거","🚗 이동","📱 통신/구독","🏥 건강/보험"],
"변동비": ["🍔 식/음료","👶 육아","🎁 경조사","🎮 취미/여가","🏥 건강/의료","✈️ 여행"],
"투자": ["🛍️ 물건소비 (인적투자)","✈️ 경험소비 (인적투자)","💰 투자/저축 (금융투자)"],
"홧김소비": ["🛒 충동구매","😤 감정소비","🤦 그냥 질러버림"]
};

const CAT_COLOR = { "고정비": "#7B9EC4", "변동비": "#C9906A", "투자": "#9B7DC4", "홧김소비": "#D97B7B" };
const CAT_LABEL = { "고정비": "🔵 고정비", "변동비": "🟠 변동비", "투자": "🟣 투자", "홧김소비": "🔴 홧김소비" };

// ✅ 변경: 새로 추가된 소분류 색상 추가
const SUB_COLOR = {
"🏡 주거":"#7B9EC4","🚗 이동":"#93B2D0","📱 통신/구독":"#AAC4DC","🏥 건강/보험":"#C2D6E8",
"🍔 식/음료":"#C9906A","👶 육아":"#D9A882","🎁 경조사":"#E8C0A0",
"🛍️ 물건소비 (인적투자)":"#9B7DC4","✈️ 경험소비 (인적투자)":"#B09CD4","💰 투자/저축 (금융투자)":"#7A5EAF",
"🎮 취미/여가":"#D9A882",
"🏥 건강/의료":"#84B8A4",
"✈️ 여행":"#6FA8C9",
"🛒 충동구매":"#D97B7B","😤 감정소비":"#E09090","🤦 그냥 질러버림":"#E8A8A8"
};

const STORAGE_KEY = "mycashbook_v3";
const INCOME_KEY = "mycashbook_income_v3";
let entries = [];
let incomes = {};
let viewMonth = new Date();

function normalizeEntries(arr) {
return arr.map(e => ({
...e,
cat2: e.cat2 ? e.cat2.replace(/.*식\/음료/, '🍔 식/음료') : e.cat2
}));
}

function load() {
try { const d = localStorage.getItem(STORAGE_KEY); if (d) entries = normalizeEntries(JSON.parse(d)); } catch(e) { entries = []; }
try { const d = localStorage.getItem(INCOME_KEY); if (d) incomes = JSON.parse(d); } catch(e) { incomes = {}; }
}

function save() {
try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch(e) {}
if (window._fbSaveEntries) window._fbSaveEntries(entries);
}

function saveIncomes() {
try { localStorage.setItem(INCOME_KEY, JSON.stringify(incomes)); } catch(e) {}
if (window._fbSaveIncomes) window._fbSaveIncomes(incomes);
}

function getMonthIncome(mk) {
return (incomes[mk] || []).reduce((s,i) => s+i.amount, 0);
}

function fmtMoney(n) { return Number(n).toLocaleString('ko-KR') + '원'; }

function getOrCreateTooltip(chart) {
let el = chart.canvas.parentNode.querySelector('.custom-pie-tooltip');
if (!el) {
el = document.createElement('div');
el.className = 'custom-pie-tooltip';
el.style.cssText = 'position:absolute;background:rgba(30,30,30,0.88);color:#fff;border-radius:6px;padding:8px 12px;font-size:12px;font-family:var(--sans);pointer-events:none;white-space:nowrap;opacity:0;transition:opacity 0.15s;z-index:999;';
chart.canvas.parentNode.appendChild(el);
}
return el;
}

function externalPieTooltip(context) {
const { chart, tooltip } = context;
const el = getOrCreateTooltip(chart);
if (tooltip.opacity === 0) { el.style.opacity = '0'; return; }
if (tooltip.body) {
el.innerHTML = tooltip.body.map(b => b.lines).flat().map(l => '<div>'+l.trim()+'</div>').join('');
}
el.style.opacity = '1';
const cRect = chart.canvas.getBoundingClientRect();
const pRect = chart.canvas.parentNode.getBoundingClientRect();
const ox = cRect.left - pRect.left;
const oy = cRect.top - pRect.top;
const tw = el.offsetWidth;
const th = el.offsetHeight;
let x = ox + tooltip.caretX - tw / 2;
let y = oy + tooltip.caretY - th - 12;
if (x < 0) x = 0;
if (x + tw > pRect.width) x = pRect.width - tw;
if (y < 0) y = oy + tooltip.caretY + 12;
el.style.left = x + 'px';
el.style.top = y + 'px';
}

function formatAmountInput(el) {
const raw = el.value.replace(/[^0-9]/g, '');
const num = parseInt(raw) || 0;
el.value = num ? num.toLocaleString('ko-KR') : '';
const hidden = document.getElementById('inp-amount');
if (hidden) hidden.value = num || '';
}

function fmtDate(d) {
const dt = new Date(d + 'T00:00:00');
return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
}

function getMonthKey(d) { return d.slice(0,7); }
function catColor(cat1) { return CAT_COLOR[cat1] || '#999'; }
function catLabel(cat1) { return CAT_LABEL[cat1] || cat1; }

function updateCat2() {
const c1 = document.getElementById('inp-cat1').value;
const c2 = document.getElementById('inp-cat2');
c2.innerHTML = '';
if (!c1) { c2.innerHTML = '<option>대분류 먼저 선택</option>'; return; }
CAT_MAP[c1].forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; c2.appendChild(o); });
}

function switchTab(t) {
document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
document.querySelector('.tab[data-tab="'+t+'"]').classList.add('active');
document.getElementById('sec-'+t).classList.add('active');
if (t === 'list') { populateMonthFilter(); renderList(); }
if (t === 'monthly') renderMonthly();
if (t === 'calendar') renderCalendar();
if (t === 'retro') renderRetro();
}

function addEntry() {
const date = document.getElementById('inp-date').value;
const amount = parseFloat(document.getElementById('inp-amount').value);
const cat1 = document.getElementById('inp-cat1').value;
const cat2 = document.getElementById('inp-cat2').value;
const desc = document.getElementById('inp-desc').value.trim();
const memo = document.getElementById('inp-memo').value.trim();
const values = document.getElementById('chk-values').checked;
if (!date || !amount || !cat1 || !cat2 || !desc) { showToast('날짜, 금액, 분류, 내용을 모두 입력해주세요.'); return; }
entries.push({ id: Date.now(), date, amount, cat1, cat2, desc, memo, values });
entries.sort((a,b) => b.date.localeCompare(a.date));
save();
document.getElementById('inp-amount').value = '';
document.getElementById('inp-amount-display').value = '';
document.getElementById('inp-desc').value = '';
document.getElementById('inp-memo').value = '';
document.getElementById('chk-values').checked = false;
renderQuickSummary();
showToast('기록이 추가되었어요!');
}

function renderQuickSummary() {
const now = new Date();
const mk = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
const data = entries.filter(e => getMonthKey(e.date) === mk);
const total = data.reduce((s,e)=>s+e.amount,0);
const vc = data.filter(e=>e.values).length;
const pct = data.length ? Math.round(vc/data.length*100) : 0;
const cats = {};
data.forEach(e => { cats[e.cat2]=(cats[e.cat2]||0)+e.amount; });
const top = Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
const income = getMonthIncome(mk);
const balance = income - total;
const balColor = balance >= 0 ? 'var(--green)' : 'var(--red)';
const usedPct = income > 0 ? Math.round(total/income*100) : null;
document.getElementById('quick-summary').innerHTML = `
<div class="sum-block"><div class="lbl">이번 달 수입</div><div class="val" style="color:var(--green);">${income > 0 ? income.toLocaleString('ko-KR')+'원' : '-'}</div><div class="sub">&nbsp;</div></div>
<div class="sum-block"><div class="lbl">이번 달 지출</div><div class="val">${total.toLocaleString('ko-KR')}원</div><div class="sub">${data.length}건</div></div>
<div class="sum-block"><div class="lbl">잔액</div><div class="val" style="color:${balColor};">${income > 0 ? (balance>=0?'+':'')+balance.toLocaleString('ko-KR')+'원' : '-'}</div><div class="sub">${usedPct !== null ? '지출 '+usedPct+'%' : ''}</div></div>
<div class="sum-block"><div class="lbl">가치관 부합률</div><div class="val">${pct}%</div><div class="sub">${vc} / ${data.length}건</div></div>
<div class="sum-block"><div class="lbl">최다 지출</div><div class="val" style="font-size:14px;">${top ? catLabel(top[0]) : '-'}</div><div class="sub">${top ? top[1].toLocaleString('ko-KR')+'원' : ''}</div></div>
`;
renderIncomeList(mk);
}

function renderIncomeList(mk) {
const list = incomes[mk] || [];
const el = document.getElementById('income-list');
const tot = document.getElementById('income-total');
if (!el) return;
el.innerHTML = list.map(i => `
<div class="income-item">
<span class="i-desc">${i.desc}</span>
<span class="i-amt">+${i.amount.toLocaleString('ko-KR')}원</span>
<button class="i-del" onclick="deleteIncome('${mk}',${i.id})">×</button>
</div>`).join('');
const total = list.reduce((s,i)=>s+i.amount,0);
if (tot) {
if (list.length > 0) {
tot.style.display = 'flex';
tot.innerHTML = `<span>이번 달 수입 합계</span><strong>+${total.toLocaleString('ko-KR')}원</strong>`;
} else {
tot.style.display = 'none';
}
}
}

function addIncome() {
const desc = document.getElementById('inp-income-desc').value.trim();
const amount = parseFloat(document.getElementById('inp-income-amt').value);
if (!desc || !amount) { showToast('수입 항목과 금액을 입력해주세요.'); return; }
const now = new Date();
const mk = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
if (!incomes[mk]) incomes[mk] = [];
incomes[mk].push({ id: Date.now(), desc, amount });
saveIncomes();
document.getElementById('inp-income-desc').value = '';
document.getElementById('inp-income-amt').value = '';
renderQuickSummary();

let calMonth = new Date();

function changeCalMonth(d) {

function renderCalendar() {
const y = calMonth.getFullYear();
const m = calMonth.getMonth();
document.getElementById('cal-title').textContent = `${y}년 ${m+1}월`;
const mk = `${y}-${String(m+1).padStart(2,'0')}`;
const monthEntries = entries.filter(e => getMonthKey(e.date) === mk);
const byDate = {};
monthEntries.forEach(e => {
if (!byDate[e.date]) byDate[e.date] = [];
byDate[e.date].push(e);
});
const firstDay = new Date(y, m, 1).getDay();
const lastDate = new Date(y, m+1, 0).getDate();
const today = new Date();
const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
const weekdays = ['일','월','화','수','목','금','토'];
let html = '<div class="cal-grid">';
weekdays.forEach(w => { html += `<div class="cal-weekday">${w}</div>`; });
const prevLastDate = new Date(y, m, 0).getDate();
for (let i = 0; i < firstDay; i++) {
const d = prevLastDate - firstDay + i + 1;
html += `<div class="cal-cell other-month"><span class="cal-date">${d}</span></div>`;
}
for (let d = 1; d <= lastDate; d++) {
const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const dayEntries = byDate[dateStr] || [];
const dow = new Date(y, m, d).getDay();
const isToday = dateStr === todayStr;
const hasSun = dow === 0 ? 'sun' : '';
const hasSat = dow === 6 ? 'sat' : '';
const hasRec = dayEntries.length > 0 ? 'has-record' : '';
const isTodayCls = isToday ? 'is-today' : '';
const dayTotal = dayEntries.reduce((s,e)=>s+e.amount,0);
const dots = dayEntries.slice(0,6).map(e=>`<div class="cal-dot-item" style="background:${catColor(e.cat1)};"></div>`).join('');
html += `<div class="cal-cell ${hasSun} ${hasSat} ${hasRec} ${isTodayCls}" ${hasRec ? `onclick="showCalPopup('${dateStr}')"` : ''}>
<span class="cal-date">${d}</span>
${dayEntries.length ? `<div class="cal-dots">${dots}</div><div class="cal-total">${(dayTotal/10000).toFixed(0)}만</div>` : ''}
</div>`;
}
const totalCells = firstDay + lastDate;
const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
for (let i = 1; i <= remaining; i++) {
html += `<div class="cal-cell other-month"><span class="cal-date">${i}</span></div>`;
}
html += '</div>';
const existing = document.getElementById('cal-popup');
if (existing) existing.remove();
document.getElementById('cal-body').innerHTML = html;
}

function showCalPopup(dateStr) {
const dayEntries = entries.filter(e => e.date === dateStr);
if (!dayEntries.length) return;
const existing = document.getElementById('cal-popup');
if (existing) existing.remove();
const dt = new Date(dateStr + 'T00:00:00');
const dayTotal = dayEntries.reduce((s,e)=>s+e.amount,0);
let html = `<div class="cal-popup" id="cal-popup">
<div class="cal-popup-date">
<span>${dt.getMonth()+1}월 ${dt.getDate()}일 · 합계 ${dayTotal.toLocaleString('ko-KR')}원</span>
<button class="cal-popup-close" onclick="document.getElementById('cal-popup').remove()">×</button>
</div>`;
dayEntries.forEach(e => {
html += `<div class="cal-popup-item">
<div class="cal-popup-stripe" style="background:${catColor(e.cat1)};"></div>
<div class="cal-popup-info">
<div class="cal-popup-desc">${e.desc}</div>
<div class="cal-popup-sub">${catLabel(e.cat1)} › ${e.cat2}</div>
</div>
<div class="cal-popup-amt">${fmtMoney(e.amount)}</div>
</div>`;
});
html += '</div>';
document.getElementById('cal-body').insertAdjacentHTML('afterend', html);
}

function exportCSV() {
if (!entries.length) { showToast('내보낼 데이터가 없어요.'); return; }
const header = ['날짜','금액','대분류','소분류','내용','메모','가치관부합'];
const rows = entries.map(e => [e.date, e.amount, e.cat1, e.cat2, e.desc, e.memo||'', e.values?'O':'X']);
const csv = [header, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
const blob = new Blob(['\uFEFF'+csv], { type: 'text/csv;charset=utf-8;' });
const url = URL.createObjectURL(blob);
const a = document.createElement('a'); a.href = url; a.download = '가계부.csv'; a.click();
URL.revokeObjectURL(url);
}

<div class="sim-card">
<h3>💸 투자 시뮬레이터</h3>
<div style="display:flex;gap:8px;margin-bottom:1.25rem;">
<button class="scen-btn" id="scen-pessimistic" onclick="setScenario('pessimistic')">😰 보수적<br><span style="font-size:11px;">연 4% · 예적금</span></button>
<button class="scen-btn" id="scen-neutral" onclick="setScenario('neutral')">😐 중립<br><span style="font-size:11px;">연 7% · 혼합</span></button>
<button class="scen-btn active-optimistic" id="scen-optimistic" onclick="setScenario('optimistic')">😊 낙관적<br><span style="font-size:11px;">연 10% · 주식</span></button>
</div>
<div class="sim-inputs">
<div class="field"><label>월 투자액 (원)</label><input type="number" id="sim-monthly" value="${Math.max(mInvest,100000)}" min="0" oninput="runSim()" /></div>
<div class="field"><label>연 수익률 (%)</label><input type="number" id="sim-rate" value="10" min="0" max="100" step="0.1" oninput="runSim()" /></div>
<div class="field"><label>투자 기간 (년)</label><input type="number" id="sim-years" value="10" min="1" max="50" oninput="runSim()" /></div>
</div>
<div class="sim-result" id="sim-result"></div>
<div class="sim-chart-wrap"><canvas id="sim-chart" height="180"></canvas></div>
</div>

<div class="practice-card">
<h3>🎯 이달의 실천 평가</h3>
<div class="practice-eval">
<button class="eval-btn ${curPractice.eval==='good'?'selected-good':''}" onclick="setPracticeEval('${mk}','good')">😊 잘 지켰어요</button>
<button class="eval-btn ${curPractice.eval==='mid'?'selected-mid':''}" onclick="setPracticeEval('${mk}','mid')">😐 보통이에요</button>
<button class="eval-btn ${curPractice.eval==='bad'?'selected-bad':''}" onclick="setPracticeEval('${mk}','bad')">😔 아쉬웠어요</button>
</div>
</div>

<div class="pr-card">
<h3>📝 이달의 소비 회고</h3>
<textarea class="retro-memo" id="retro-memo-input" placeholder="이번 달 소비를 돌아보며 느낀 점을 자유롭게 적어보세요...">${curRetro.memo}</textarea>
<div style="display:flex;justify-content:flex-end;margin-top:10px;">
<button onclick="saveRetroMemo('${mk}')" style="font-family:var(--sans);font-size:13px;padding:7px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;">저장</button>
</div>
<div class="keyword-wrap" id="keyword-wrap">
${(curRetro.keywords||[]).map(k=>`<span class="keyword-tag">${k}</span>`).join('')}
</div>
</div>

<div class="pr-card">
<h3>💡 나의 소비 원칙</h3>
<textarea class="principle-editor" id="principle-input" placeholder="나의 소비 원칙을 적어보세요...">${loadPrinciple()}</textarea>
<div style="display:flex;justify-content:flex-end;margin-top:10px;">
<button onclick="savePrincipleBtn()" style="font-family:var(--sans);font-size:13px;padding:7px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;">저장</button>
</div>
</div>
`;
document.getElementById('retro-content').innerHTML = html;
runSim();
}

let simChart = null;
let currentScenario = 'optimistic';

function setScenario(s) {
currentScenario = s;
const rates = { pessimistic: 4, neutral: 7, optimistic: 10 };
document.getElementById('sim-rate').value = rates[s];
['pessimistic','neutral','optimistic'].forEach(sc => {
const btn = document.getElementById('scen-'+sc);
if (btn) btn.className = 'scen-btn' + (sc===s?' active-'+sc:'');
});
runSim();
}

function runSim() {
const monthly = parseFloat(document.getElementById('sim-monthly')?.value) || 0;
const rate = parseFloat(document.getElementById('sim-rate')?.value) || 0;
const years = parseInt(document.getElementById('sim-years')?.value) || 10;
const monthlyRate = rate / 100 / 12;
const months = years * 12;
let total = 0;
const yearlyData = [0];
for (let i = 1; i <= months; i++) {
total = (total + monthly) * (1 + monthlyRate);
if (i % 12 === 0) yearlyData.push(Math.round(total));
}
const invested = monthly * months;
const profit = total - invested;
const resultEl = document.getElementById('sim-result');
if (resultEl) {
resultEl.innerHTML = `
<div class="sr-main">${Math.round(total).toLocaleString('ko-KR')}원</div>
<div class="sr-sub">${years}년 후 예상 자산 · 원금 ${invested.toLocaleString('ko-KR')}원 + 수익 ${Math.round(profit).toLocaleString('ko-KR')}원</div>
`;
}
const ctx = document.getElementById('sim-chart');
if (!ctx) return;
if (simChart) { simChart.destroy(); }
simChart = new Chart(ctx, {
type: 'bar',
data: {
labels: yearlyData.map((_,i) => i===0?'현재':`${i}년`),
datasets: [
{ label: '원금', data: yearlyData.map((_,i)=>Math.min(monthly*i*12,invested)), backgroundColor: '#C2D6E8' },
{ label: '수익', data: yearlyData.map((v,i)=>Math.max(0,v-Math.min(monthly*i*12,invested))), backgroundColor: '#84B8A4' }
]
},
options: {
responsive: true,
plugins: { legend: { labels: { font: { family: 'Noto Sans KR', size: 11 }, color: '#6B6760' } },
tooltip: { callbacks: { label: c => ` ${c.dataset.label}: ${c.raw.toLocaleString('ko-KR')}원` } }
},
scales: {
x: { stacked: true, ticks: { font: { family: 'Noto Sans KR', size: 11 }, color: '#9A9690' }, grid: { display: false } },
y: { stacked: true, ticks: { font: { family: 'Noto Sans KR', size: 11 }, color: '#9A9690', callback: v => (v/10000).toFixed(0)+'만' }, grid: { color: '#EDEAE2' } }
}
}
});
}

function setPracticeEval(mk, val) {
const data = loadPractice();
data[mk] = { eval: val };
savePractice(data);
renderRetro();
showToast('평가가 저장되었어요!');
}

function saveRetroMemo(mk) {
const memo = document.getElementById('retro-memo-input')?.value || '';
const data = loadRetroData();
if (!data[mk]) data[mk] = { memo:'', keywords:[] };
data[mk].memo = memo;
data[mk].keywords = extractKeywords(memo);
saveRetroData(data);
const wrap = document.getElementById('keyword-wrap');
if (wrap) wrap.innerHTML = data[mk].keywords.map(k=>`<span class="keyword-tag">${k}</span>`).join('');
showToast('회고가 저장되었어요!');
}

function savePrincipleBtn() {
const t = document.getElementById('principle-input')?.value || '';
savePrinciple(t);
showToast('원칙이 저장되었어요!');
}

function extractKeywords(text) {
const patterns = ['충동','절약','계획','후회','만족','감사','낭비','투자','목표','여행','건강','가족','외식','쇼핑'];
return patterns.filter(p => text.includes(p));
}

function showToast(msg) {
const t = document.getElementById('toast');
t.textContent = msg;
t.classList.add('show');
setTimeout(() => t.classList.remove('show'), 2200);
}

// ─── 초기화 ──────────────────────────────────────────────────
(function init() {
const today = new Date();
document.getElementById('today-lbl').textContent =
`${today.getFullYear()}.${String(today.getMonth()+1).padStart(2,'0')}.${String(today.getDate()).padStart(2,'0')}`;
const dateInp = document.getElementById('inp-date');
if (dateInp) dateInp.value = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

load();

// Firebase 로드 대기
const waitForFb = setInterval(() => {
if (window._fbReady) {
clearInterval(waitForFb);
document.getElementById('sync-status').textContent = '☁️ 동기화됨';
// Firebase 데이터 우선 사용
if (window._entries) entries = window._entries;
if (window._incomes) incomes = window._incomes;
window._appReady = true;
renderQuickSummary();
renderMonthly();
} else {
// Firebase 연결 전 로컬 데이터로 일단 렌더
window._appReady = true;
renderQuickSummary();
renderMonthly();
}
}, 100);

setTimeout(() => {
if (!window._fbReady) {
clearInterval(waitForFb);
document.getElementById('sync-status').textContent = '⚠️ 오프라인';
window._appReady = true;
renderQuickSummary();
renderMonthly();
}
}, 5000);
})();
</script>
</body>
</html>

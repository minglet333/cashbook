<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>나만의 가계부</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #F5F2EC;
  --bg2: #EDEAE2;
  --surface: #FAFAF7;
  --border: #D8D4C8;
  --border2: #C8C4B8;
  --text: #1A1814;
  --text2: #6B6760;
  --text3: #9A9690;
  --accent: #2D4A3E;
  --accent2: #3D6B5A;
  --accent-light: #E8F0EC;
  --c-fixed: #7B9EC4;
  --c-var: #C9906A;
  --c-invest: #9B7DC4;
  --green: #2D6A4F;
  --amber: #B5621A;
  --red: #B03030;
  --sans: 'Noto Sans KR', sans-serif;
  --radius: 4px;
  --radius-lg: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
body { min-height: 100vh; }

.wrapper { max-width: 780px; margin: 0 auto; padding: 0 1.5rem 4rem; }
header { padding: 2.5rem 0 2rem; border-bottom: 1px solid var(--border); margin-bottom: 2rem; display: flex; align-items: flex-end; justify-content: space-between; }
.logo { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
.logo span { color: var(--accent); }
.today-lbl { font-size: 12px; color: var(--text3); }

.tabs { display: flex; margin-bottom: 2rem; border-bottom: 1px solid var(--border); }
.tab { padding: 10px 20px; font-family: var(--sans); font-size: 14px; cursor: pointer; border: none; background: none; color: var(--text2); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color 0.2s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }

.section { display: none; }
.section.active { display: block; }

/* 카테고리 뱃지 (컬러 동그라미) */
.cat-badge { display: inline-flex; align-items: center; gap: 6px; }
.cat-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.cat-dot.fixed { background: var(--c-fixed); }
.cat-dot.var   { background: var(--c-var); }
.cat-dot.invest{ background: var(--c-invest); }

/* Summary strip */
.summary-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 2rem; }
.sum-block { background: var(--surface); padding: 14px 18px; }
.sum-block .lbl { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 4px; }
.sum-block .val { font-size: 15px; font-weight: 500; color: var(--text); }
.sum-block .sub { font-size: 11px; color: var(--text3); margin-top: 2px; }

/* Form */
.form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; margin-bottom: 1.5rem; }
.form-card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); margin-bottom: 1.25rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; }
.field input, .field select, .field textarea {
  font-family: var(--sans); font-size: 14px; background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 8px 10px; color: var(--text); outline: none; transition: border-color 0.2s;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
.field textarea { resize: none; height: 64px; line-height: 1.5; }
.mb1 { margin-bottom: 1rem; }
.values-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--accent-light); border-radius: var(--radius); border: 1px solid #C8DDD4; margin-bottom: 1.25rem; }
.values-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
.values-row label { font-size: 13px; color: var(--accent); cursor: pointer; }
.btn-primary { width: 100%; padding: 11px; font-family: var(--sans); font-size: 14px; font-weight: 500; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); cursor: pointer; transition: background 0.2s; }
.btn-primary:hover { background: var(--accent2); }

/* Entry list */
.list-controls { display: flex; gap: 10px; align-items: center; margin-bottom: 1.25rem; justify-content: space-between; }
.list-controls h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); }
.filter-wrap { display: flex; gap: 8px; }
.filter-wrap select { font-family: var(--sans); font-size: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 5px 8px; color: var(--text2); outline: none; cursor: pointer; }
.entry-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 15px; display: flex; gap: 12px; align-items: flex-start; margin-bottom: 6px; transition: border-color 0.2s; }
.entry-item:hover { border-color: var(--border2); }
.entry-stripe { width: 4px; flex-shrink: 0; border-radius: 2px; align-self: stretch; min-height: 36px; }
.entry-body { flex: 1; min-width: 0; }
.entry-desc { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.entry-sub { font-size: 12px; color: var(--text3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.entry-memo { font-size: 12px; color: var(--text2); margin-top: 4px; font-style: italic; }
.entry-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.entry-amount { font-size: 15px; font-weight: 500; color: var(--text); white-space: nowrap; }
.badge-v { font-size: 10px; padding: 2px 7px; border-radius: 99px; background: var(--accent-light); color: var(--accent); white-space: nowrap; }
.btn-del { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 18px; line-height: 1; padding: 0; margin-top: 2px; transition: color 0.2s; }
.btn-del:hover { color: var(--red); }
.empty { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 14px; }

/* Monthly */
.month-nav { display: flex; align-items: center; margin-bottom: 2rem; }
.month-nav button { background: var(--surface); border: 1px solid var(--border); padding: 7px 14px; cursor: pointer; font-size: 16px; color: var(--text2); transition: background 0.2s; }
.month-nav button:first-child { border-radius: var(--radius) 0 0 var(--radius); border-right: none; }
.month-nav button:last-child  { border-radius: 0 var(--radius) var(--radius) 0; border-left: none; }
.month-nav button:hover { background: var(--bg2); }
.month-title { flex: 1; text-align: center; font-size: 17px; font-weight: 500; color: var(--text); border: 1px solid var(--border); padding: 7px 0; background: var(--surface); }
.cat-section { margin-bottom: 1.75rem; }
.cat-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.cat-head-name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.cat-head-amt { font-size: 13px; color: var(--text2); }
.cat-row { display: flex; align-items: center; gap: 10px; margin-bottom: 7px; }
.cat-row-label { font-size: 12px; color: var(--text2); width: 150px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-bg { flex: 1; height: 5px; background: var(--bg2); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
.cat-row-amt { font-size: 11px; color: var(--text3); min-width: 70px; text-align: right; }
.values-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem 1.5rem; margin-top: 2rem; display: flex; gap: 1.5rem; align-items: center; }
.v-circle { width: 72px; height: 72px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
.v-pct { font-size: 22px; font-weight: 500; line-height: 1; }
.v-lbl { font-size: 10px; color: var(--text3); margin-top: 2px; }
.v-text { font-size: 13px; color: var(--text2); line-height: 1.7; }
.v-text strong { font-size: 14px; color: var(--text); font-weight: 500; display: block; margin-bottom: 4px; }

.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 9px 22px; border-radius: 99px; font-size: 13px; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; }
.export-btn { font-family: var(--sans); font-size: 13px; color: var(--text3); background: none; border: 1px solid var(--border); border-radius: var(--radius); padding: 5px 12px; cursor: pointer; transition: all 0.2s; }
.export-btn:hover { background: var(--bg2); color: var(--text); }

@media (max-width: 560px) {
  .grid2 { grid-template-columns: 1fr; }
  .summary-strip { grid-template-columns: 1fr; }
  .cat-row-label { width: 90px; }
}

/* 수입 카드 */
.income-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; }
.income-card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text3); margin-bottom: 1rem; }
.income-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.income-row input { font-family: var(--sans); font-size: 13px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; color: var(--text); outline: none; transition: border-color 0.2s; flex: 1; }
.income-row input:focus { border-color: var(--accent); }
.income-row .btn-add-income { padding: 7px 14px; font-size: 13px; font-family: var(--sans); background: var(--accent-light); color: var(--accent); border: 1px solid #C8DDD4; border-radius: var(--radius); cursor: pointer; white-space: nowrap; transition: background 0.2s; }
.income-row .btn-add-income:hover { background: #d4e8de; }
.income-list { display: flex; flex-direction: column; gap: 5px; }
.income-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: var(--bg); border-radius: var(--radius); font-size: 13px; }
.income-item .i-desc { color: var(--text2); flex: 1; }
.income-item .i-amt  { font-weight: 500; color: var(--green); margin-right: 10px; }
.income-item .i-del  { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 15px; transition: color 0.2s; }
.income-item .i-del:hover { color: var(--red); }
.income-total { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text2); }
.income-total strong { font-size: 15px; color: var(--green); }

/* AI 인사이트 */
.ai-insight { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.5rem; margin-top: 1.5rem; }
.ai-insight-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
.ai-insight-title { font-size: 13px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
.ai-insight-title span { font-size: 16px; }
.btn-insight { font-size: 12px; font-family: var(--sans); padding: 5px 14px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); cursor: pointer; transition: background 0.2s; white-space: nowrap; }
.btn-insight:hover { background: var(--accent2); }
.btn-insight:disabled { opacity: 0.5; cursor: not-allowed; }
.insight-loading { display: flex; align-items: center; gap: 10px; color: var(--text3); font-size: 13px; padding: 1rem 0; }
.insight-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
.insight-dot:nth-child(2) { animation-delay: 0.2s; }
.insight-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
.insight-section { margin-bottom: 1.1rem; }
.insight-section:last-child { margin-bottom: 0; }
.insight-section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
.insight-section-body { font-size: 13px; color: var(--text2); line-height: 1.75; }
.insight-good  .insight-section-label { color: var(--green); }
.insight-bad   .insight-section-label { color: var(--amber); }
.insight-quote .insight-section-label { color: var(--accent); }
.insight-quote .insight-section-body { font-style: italic; color: var(--text); font-size: 14px; border-left: 3px solid var(--accent-light); padding-left: 12px; }
.insight-empty { font-size: 13px; color: var(--text3); padding: 0.5rem 0; }

/* 캘린더 */
.cal-nav { display: flex; align-items: center; margin-bottom: 1.5rem; }
.cal-nav button { background: var(--surface); border: 1px solid var(--border); padding: 7px 14px; cursor: pointer; font-size: 16px; color: var(--text2); transition: background 0.2s; }
.cal-nav button:first-child { border-radius: var(--radius) 0 0 var(--radius); border-right: none; }
.cal-nav button:last-child  { border-radius: 0 var(--radius) var(--radius) 0; border-left: none; }
.cal-nav button:hover { background: var(--bg2); }
.cal-title { flex: 1; text-align: center; font-size: 17px; font-weight: 500; color: var(--text); border: 1px solid var(--border); padding: 7px 0; background: var(--surface); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-weekday { text-align: center; font-size: 11px; font-weight: 600; color: var(--text3); padding: 4px 0 8px; text-transform: uppercase; letter-spacing: 0.5px; }
.cal-weekday:first-child { color: #C0625A; }
.cal-weekday:last-child  { color: #5B7EC0; }
.cal-cell { aspect-ratio: 1; border-radius: var(--radius); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: default; position: relative; border: 1px solid transparent; transition: border-color 0.15s; }
.cal-cell.has-record { background: var(--surface); border-color: var(--border); cursor: pointer; }
.cal-cell.has-record:hover { border-color: var(--border2); }
.cal-cell.is-today .cal-date { background: var(--accent); color: #fff; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
.cal-cell.sun .cal-date { color: #C0625A; }
.cal-cell.sat .cal-date { color: #5B7EC0; }
.cal-cell.other-month { opacity: 0.25; }
.cal-date { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1; }
.cal-dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; max-width: 36px; }
.cal-dot-item { width: 5px; height: 5px; border-radius: 50%; }
.cal-total { font-size: 10px; color: var(--text3); margin-top: 1px; }
.cal-legend { display: flex; gap: 16px; margin-top: 1.25rem; justify-content: center; }
.cal-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text3); }
.cal-dot { width: 8px; height: 8px; border-radius: 50%; }
.cal-dot.has-entry  { background: var(--accent); }
.cal-dot.no-entry   { background: var(--border); }
.cal-dot.today-dot  { background: var(--accent); outline: 2px solid var(--accent-light); }

/* 날짜 클릭 팝업 */
.cal-popup { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1rem 1.25rem; margin-top: 1.25rem; }
.cal-popup-date { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
.cal-popup-close { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 18px; line-height: 1; }
.cal-popup-item { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.cal-popup-item:last-child { border-bottom: none; }
.cal-popup-stripe { width: 3px; height: 28px; border-radius: 2px; flex-shrink: 0; }
.cal-popup-info { flex: 1; }
.cal-popup-desc { font-size: 13px; font-weight: 500; color: var(--text); }
.cal-popup-sub  { font-size: 11px; color: var(--text3); margin-top: 1px; }
.cal-popup-amt  { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <div>
      <div class="logo">나만의 <span>가계부</span></div>
      <div style="font-size:12px;color:var(--text3);margin-top:3px;">가치관과 돈의 흐름을 기록합니다</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;"><div class="today-lbl" id="today-lbl"></div><div id="sync-status" style="font-size:11px;color:var(--text3);">⏳ 연결 중...</div></div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('monthly')">월별 분석</button>
    <button class="tab" onclick="switchTab('input')">기록</button>
    <button class="tab" onclick="switchTab('list')">내역</button>
    <button class="tab" onclick="switchTab('calendar')">캘린더</button>
  </div>

  <!-- 월별 분석 -->
  <div class="section active" id="sec-monthly">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">&#8249;</button>
      <span class="month-title" id="month-title"></span>
      <button onclick="changeMonth(1)">&#8250;</button>
    </div>
    <div id="monthly-content"></div>
  </div>

  <!-- 기록 -->
  <div class="section" id="sec-input">
    <div class="summary-strip" id="quick-summary" style="grid-template-columns:repeat(5,1fr);"></div>
    <!-- 이번 달 수입 카드 -->
    <div class="income-card">
      <h3>💚 이번 달 수입</h3>
      <div class="income-row">
        <input type="text" id="inp-income-desc" placeholder="수입 항목 (예: 월급, 부업)" />
        <input type="number" id="inp-income-amt" placeholder="금액" min="0" style="max-width:140px;" />
        <button class="btn-add-income" onclick="addIncome()">+ 추가</button>
      </div>
      <div class="income-list" id="income-list"></div>
      <div class="income-total" id="income-total" style="display:none;"></div>
    </div>
    <div class="form-card">
      <h3>새 항목 추가</h3>
      <div class="grid2">
        <div class="field"><label>날짜</label><input type="date" id="inp-date" /></div>
        <div class="field"><label>금액 (원)</label><input type="number" id="inp-amount" placeholder="0" min="0" /></div>
      </div>
      <div class="grid2 mb1">
        <div class="field">
          <label>대분류</label>
          <select id="inp-cat1" onchange="updateCat2()">
            <option value="">선택하세요</option>
            <option value="고정비">🔵 고정비</option>
            <option value="변동비">🟠 변동비</option>
            <option value="투자">🟣 투자</option>
          </select>
        </div>
        <div class="field">
          <label>소분류</label>
          <select id="inp-cat2"><option value="">대분류 먼저 선택</option></select>
        </div>
      </div>
      <div class="field mb1"><label>내용</label><input type="text" id="inp-desc" placeholder="무엇에 썼나요?" /></div>
      <div class="field mb1"><label>메모 (선택)</label><textarea id="inp-memo" placeholder="왜 이 소비를 했나요? 어떤 의미가 있나요?"></textarea></div>
      <div class="values-row">
        <input type="checkbox" id="chk-values" />
        <label for="chk-values">✓ 내 가치관에 부합하는 소비였다</label>
      </div>
      <button class="btn-primary" onclick="addEntry()">+ 기록 추가</button>
    </div>
  </div>

  <!-- 내역 -->
  <div class="section" id="sec-list">
    <div class="list-controls">
      <h3>전체 내역</h3>
      <div style="display:flex;gap:8px;align-items:center;">
        <div class="filter-wrap">
          <select id="filter-month" onchange="renderList()"><option value="">전체 기간</option></select>
          <select id="filter-cat" onchange="renderList()">
            <option value="">전체</option>
            <option value="고정비">🔵 고정비</option>
            <option value="변동비">🟠 변동비</option>
            <option value="투자">🟣 투자</option>
          </select>
        </div>
        <button class="export-btn" onclick="exportCSV()">CSV 내보내기</button>
      </div>
    </div>
    <div id="entry-list"></div>
  </div>
  <!-- 캘린더 -->
  <div class="section" id="sec-calendar">
    <div class="cal-nav">
      <button onclick="changeCalMonth(-1)">&#8249;</button>
      <span class="cal-title" id="cal-title"></span>
      <button onclick="changeCalMonth(1)">&#8250;</button>
    </div>
    <div id="cal-body"></div>
    <div class="cal-legend">
      <div class="cal-legend-item"><div class="cal-dot has-entry"></div><span>기록 있음</span></div>
      <div class="cal-legend-item"><div class="cal-dot no-entry"></div><span>기록 없음</span></div>
      <div class="cal-legend-item"><div class="cal-dot today-dot"></div><span>오늘</span></div>
    </div>
  </div>
</div>

  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDJYyb_qUbTiwznpxazy4IKE5FrgmUg7VI",
    authDomain: "numi-dumi-cashbook.firebaseapp.com",
    projectId: "numi-dumi-cashbook",
    storageBucket: "numi-dumi-cashbook.firebasestorage.app",
    messagingSenderId: "102621154749",
    appId: "1:102621154749:web:5c433c45db54434b5a96d4",
    databaseURL: "https://numi-dumi-cashbook-default-rtdb.asia-southeast1.firebasedatabase.app"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);

  // entries 실시간 동기화
  onValue(ref(db, 'entries'), function(snap) {
    const val = snap.val();
    window._entries = val ? Object.values(val).sort((a,b)=>b.date.localeCompare(a.date)) : [];
    if (window._appReady) {
      entries = window._entries;
      renderQuickSummary();
      const active = document.querySelector('.tab.active');
      if (active) {
        const t = active.getAttribute('onclick').match(/switchTab\('(\w+)'\)/);
        if (t) {
          if (t[1]==='list')     { populateMonthFilter(); renderList(); }
          if (t[1]==='monthly')  renderMonthly();
          if (t[1]==='calendar') renderCalendar();
        }
      }
    }
  });

  // incomes 실시간 동기화
  onValue(ref(db, 'incomes'), function(snap) {
    const val = snap.val();
    window._incomes = val || {};
    if (window._appReady) {
      incomes = window._incomes;
      renderQuickSummary();
    }
  });

  // 외부에서 호출할 수 있도록 window에 노출
  window._fbSaveEntries = function(data) {
    const obj = {};
    data.forEach(function(e){ obj['e'+e.id] = e; });
    set(ref(db, 'entries'), obj);
  };
  window._fbSaveIncomes = function(data) {
    set(ref(db, 'incomes'), data);
  };

  window._fbReady = true;
  console.log('Firebase 연결 완료');
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
// ─── 데이터 정의 ────────────────────────────────────────────
const CAT_MAP = {
  "고정비": ["🏡 주거","🚗 이동","📱 통신/구독","🏥 건강/보험"],
  "변동비": ["🍽️ 식/음료","👶 육아","🎁 경조사"],
  "투자":   ["🛍️ 물건소비 (인적투자)","✈️ 경험소비 (인적투자)","💰 투자/저축 (금융투자)"]
};

// 대분류: 컬러 (동그라미용)
const CAT_COLOR  = { "고정비": "#7B9EC4", "변동비": "#C9906A", "투자": "#9B7DC4" };
// 대분류: 표시 레이블 (동그라미 이모지 포함)
const CAT_LABEL  = { "고정비": "🔵 고정비", "변동비": "🟠 변동비", "투자": "🟣 투자" };
// 소분류: 컬러
const SUB_COLOR = {
  "🏡 주거":"#7B9EC4","🚗 이동":"#93B2D0","📱 통신/구독":"#AAC4DC","🏥 건강/보험":"#C2D6E8",
  "🍽️ 식/음료":"#C9906A","👶 육아":"#D9A882","🎁 경조사":"#E8C0A0",
  "🛍️ 물건소비 (인적투자)":"#9B7DC4","✈️ 경험소비 (인적투자)":"#B09CD4","💰 투자/저축 (금융투자)":"#7A5EAF"
};

const STORAGE_KEY = "mycashbook_v3";
const INCOME_KEY  = "mycashbook_income_v3";
let entries = [];
let incomes = {};   // { "2026-05": [{id, desc, amount}], ... }
let viewMonth = new Date();

// ─── 저장/불러오기 ────────────────────────────────────────────
function load() {
  try { const d = localStorage.getItem(STORAGE_KEY); if (d) entries = JSON.parse(d); } catch(e) { entries = []; }
  try { const d = localStorage.getItem(INCOME_KEY);  if (d) incomes = JSON.parse(d); } catch(e) { incomes = {}; }
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(entries)); } catch(e) {}
  if (window._fbSaveEntries) window._fbSaveEntries(entries);
}
function saveIncomes() {
  try { localStorage.setItem(INCOME_KEY, JSON.stringify(incomes)); } catch(e) {}
  if (window._fbSaveIncomes) window._fbSaveIncomes(incomes);
}
function getMonthIncome(mk) {
  return (incomes[mk] || []).reduce((s,i) => s+i.amount, 0);
}

// (더미데이터 제거됨)

// ─── 유틸 ────────────────────────────────────────────────────
function fmtMoney(n) { return Number(n).toLocaleString('ko-KR') + '원'; }
function fmtDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return `${dt.getFullYear()}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}`;
}
function getMonthKey(d) { return d.slice(0,7); }

// ─── 대분류 → 컬러/레이블 헬퍼 ─────────────────────────────
function catColor(cat1) { return CAT_COLOR[cat1] || '#999'; }
function catLabel(cat1) { return CAT_LABEL[cat1] || cat1; }

// ─── UI ──────────────────────────────────────────────────────
function updateCat2() {
  const c1 = document.getElementById('inp-cat1').value;
  const c2 = document.getElementById('inp-cat2');
  c2.innerHTML = '';
  if (!c1) { c2.innerHTML = '<option>대분류 먼저 선택</option>'; return; }
  CAT_MAP[c1].forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; c2.appendChild(o); });
}

function switchTab(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  const idx = ['monthly','input','list','calendar'].indexOf(t);
  document.querySelectorAll('.tab')[idx].classList.add('active');
  document.getElementById('sec-'+t).classList.add('active');
  if (t === 'list')    { populateMonthFilter(); renderList(); }
  if (t === 'monthly') renderMonthly();
  if (t === 'calendar') renderCalendar();
}

function addEntry() {
  const date   = document.getElementById('inp-date').value;
  const amount = parseFloat(document.getElementById('inp-amount').value);
  const cat1   = document.getElementById('inp-cat1').value;
  const cat2   = document.getElementById('inp-cat2').value;
  const desc   = document.getElementById('inp-desc').value.trim();
  const memo   = document.getElementById('inp-memo').value.trim();
  const values = document.getElementById('chk-values').checked;
  if (!date || !amount || !cat1 || !cat2 || !desc) { showToast('날짜, 금액, 분류, 내용을 모두 입력해주세요.'); return; }
  entries.push({ id: Date.now(), date, amount, cat1, cat2, desc, memo, values });
  entries.sort((a,b) => b.date.localeCompare(a.date));
  save();
  document.getElementById('inp-amount').value = '';
  document.getElementById('inp-desc').value = '';
  document.getElementById('inp-memo').value = '';
  document.getElementById('chk-values').checked = false;
  renderQuickSummary();
  showToast('기록이 추가되었어요!');
}

function renderQuickSummary() {
  const now = new Date();
  const mk = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const data = entries.filter(e => getMonthKey(e.date) === mk);
  const total = data.reduce((s,e)=>s+e.amount,0);
  const vc = data.filter(e=>e.values).length;
  const pct = data.length ? Math.round(vc/data.length*100) : 0;
  const cats = {};
  data.forEach(e => { cats[e.cat1]=(cats[e.cat1]||0)+e.amount; });
  const top = Object.entries(cats).sort((a,b)=>b[1]-a[1])[0];
  const income = getMonthIncome(mk);
  const balance = income - total;
  const balColor = balance >= 0 ? 'var(--green)' : 'var(--red)';
  const usedPct = income > 0 ? Math.round(total/income*100) : null;
  document.getElementById('quick-summary').innerHTML = `
    <div class="sum-block"><div class="lbl">이번 달 수입</div><div class="val" style="color:var(--green);">${income > 0 ? income.toLocaleString('ko-KR')+'원' : '-'}</div><div class="sub">&nbsp;</div></div>
    <div class="sum-block"><div class="lbl">이번 달 지출</div><div class="val">${total.toLocaleString('ko-KR')}원</div><div class="sub">${data.length}건</div></div>
    <div class="sum-block"><div class="lbl">잔액</div><div class="val" style="color:${balColor};">${income > 0 ? (balance>=0?'+':'')+balance.toLocaleString('ko-KR')+'원' : '-'}</div><div class="sub">${usedPct !== null ? '지출 '+usedPct+'%' : ''}</div></div>
    <div class="sum-block"><div class="lbl">가치관 부합률</div><div class="val">${pct}%</div><div class="sub">${vc} / ${data.length}건</div></div>
    <div class="sum-block"><div class="lbl">최다 지출</div><div class="val" style="font-size:14px;">${top ? catLabel(top[0]) : '-'}</div><div class="sub">${top ? top[1].toLocaleString('ko-KR')+'원' : ''}</div></div>
  `;
  renderIncomeList(mk);
}
function renderIncomeList(mk) {
  const list = incomes[mk] || [];
  const el = document.getElementById('income-list');
  const tot = document.getElementById('income-total');
  if (!el) return;
  el.innerHTML = list.map(i => `
    <div class="income-item">
      <span class="i-desc">${i.desc}</span>
      <span class="i-amt">+${i.amount.toLocaleString('ko-KR')}원</span>
      <button class="i-del" onclick="deleteIncome('${mk}',${i.id})">×</button>
    </div>`).join('');
  const total = list.reduce((s,i)=>s+i.amount,0);
  if (tot) {
    if (list.length > 0) {
      tot.style.display = 'flex';
      tot.innerHTML = `<span>이번 달 수입 합계</span><strong>+${total.toLocaleString('ko-KR')}원</strong>`;
    } else {
      tot.style.display = 'none';
    }
  }
}
function addIncome() {
  const desc = document.getElementById('inp-income-desc').value.trim();
  const amount = parseFloat(document.getElementById('inp-income-amt').value);
  if (!desc || !amount) { showToast('수입 항목과 금액을 입력해주세요.'); return; }
  const now = new Date();
  const mk = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  if (!incomes[mk]) incomes[mk] = [];
  incomes[mk].push({ id: Date.now(), desc, amount });
  saveIncomes();
  document.getElementById('inp-income-desc').value = '';
  document.getElementById('inp-income-amt').value = '';
  renderQuickSummary();
  showToast('수입이 추가되었어요!');
}
function deleteIncome(mk, id) {
  if (!incomes[mk]) return;
  incomes[mk] = incomes[mk].filter(i=>i.id!==id);
  saveIncomes();
  renderQuickSummary();
}

function populateMonthFilter() {
  const months = [...new Set(entries.map(e=>getMonthKey(e.date)))].sort((a,b)=>b.localeCompare(a));
  const sel = document.getElementById('filter-month');
  const cur = sel.value;
  sel.innerHTML = '<option value="">전체 기간</option>' +
    months.map(m=>`<option value="${m}"${m===cur?' selected':''}>${m.replace('-','년 ')}월</option>`).join('');
}

function renderList() {
  const fm = document.getElementById('filter-month').value;
  const fc = document.getElementById('filter-cat').value;
  let data = entries.filter(e => (!fm||getMonthKey(e.date)===fm) && (!fc||e.cat1===fc));
  const el = document.getElementById('entry-list');
  if (!data.length) { el.innerHTML = '<div class="empty">내역이 없습니다.</div>'; return; }
  el.innerHTML = data.map(e => `
    <div class="entry-item">
      <div class="entry-stripe" style="background:${catColor(e.cat1)};"></div>
      <div class="entry-body">
        <div class="entry-desc">${e.desc}</div>
        <div class="entry-sub">
          <span>${fmtDate(e.date)}</span>
          <span style="color:var(--border2);">|</span>
          <span>${catLabel(e.cat1)} › ${e.cat2}</span>
          ${e.values ? '<span class="badge-v">✓ 가치관 부합</span>' : ''}
        </div>
        ${e.memo ? `<div class="entry-memo">${e.memo}</div>` : ''}
      </div>
      <div class="entry-right">
        <span class="entry-amount">${fmtMoney(e.amount)}</span>
        <button class="btn-del" onclick="deleteEntry(${e.id})" title="삭제">×</button>
      </div>
    </div>
  `).join('');
}

function deleteEntry(id) {
  if (!confirm('이 항목을 삭제할까요?')) return;
  entries = entries.filter(e=>e.id!==id);
  save();
  renderList();
  renderQuickSummary();
  populateMonthFilter();
}

function changeMonth(d) {
  viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()+d, 1);
  renderMonthly();
}

function renderMonthly() {
  const mk = `${viewMonth.getFullYear()}-${String(viewMonth.getMonth()+1).padStart(2,'0')}`;
  document.getElementById('month-title').textContent = `${viewMonth.getFullYear()}년 ${viewMonth.getMonth()+1}월`;
  const data = entries.filter(e=>getMonthKey(e.date)===mk);
  const total = data.reduce((s,e)=>s+e.amount,0);
  const vc = data.filter(e=>e.values).length;
  const pct = data.length ? Math.round(vc/data.length*100) : 0;

  if (!data.length) {
    document.getElementById('monthly-content').innerHTML = '<div class="empty">이 달의 내역이 없습니다.</div>';
    if (window._pieChart) { window._pieChart.destroy(); window._pieChart = null; }
    return;
  }

  const byCat = {};
  data.forEach(e => {
    if (!byCat[e.cat1]) byCat[e.cat1] = { total:0, subs:{} };
    byCat[e.cat1].total += e.amount;
    byCat[e.cat1].subs[e.cat2] = (byCat[e.cat1].subs[e.cat2]||0)+e.amount;
  });
  const maxAmt = Math.max(...Object.values(byCat).map(v=>v.total),1);
  const avg = data.length ? Math.round(total/data.length) : 0;

  const mIncome = getMonthIncome(mk);
  const mBalance = mIncome - total;
  const mUsedPct = mIncome > 0 ? Math.round(total/mIncome*100) : null;

  let html = `
    <div class="summary-strip" style="margin-bottom:2rem;grid-template-columns:repeat(${mIncome > 0 ? 3 : 2},1fr);">
      ${mIncome > 0 ? `<div class="sum-block"><div class="lbl">월 수입</div><div class="val" style="color:var(--green);">${mIncome.toLocaleString('ko-KR')}원</div><div class="sub">&nbsp;</div></div>` : ''}
      <div class="sum-block"><div class="lbl">총 지출</div><div class="val">${total.toLocaleString('ko-KR')}원</div><div class="sub">${data.length}건${mUsedPct!==null?' · 수입의 '+mUsedPct+'%':''}</div></div>
      ${mIncome > 0 ? `<div class="sum-block"><div class="lbl">잔액</div><div class="val" style="color:${mBalance>=0?'var(--green)':'var(--red)'};">${(mBalance>=0?'+':'')+mBalance.toLocaleString('ko-KR')}원</div><div class="sub">&nbsp;</div></div>` : ''}
      <div class="sum-block"><div class="lbl">건당 평균</div><div class="val">${avg.toLocaleString('ko-KR')}원</div></div>
    </div>
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1.25rem 1.5rem;margin-bottom:2rem;">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.8px;color:var(--text3);margin-bottom:1rem;">대분류별 지출 비중</div>
      <div style="display:flex;align-items:center;gap:2rem;flex-wrap:wrap;">
        <div style="width:180px;height:180px;flex-shrink:0;"><canvas id="pie-chart"></canvas></div>
        <div id="pie-legend" style="flex:1;min-width:140px;display:flex;flex-direction:column;gap:12px;"></div>
      </div>
    </div>
  `;

  ['고정비','변동비','투자'].forEach(cat1 => {
    if (!byCat[cat1]) return;
    const info = byCat[cat1];
    const pBar = Math.round(info.total/maxAmt*100);
    const col = catColor(cat1);
    html += `<div class="cat-section">
      <div class="cat-head">
        <span class="cat-head-name">
          <span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${col};flex-shrink:0;"></span>
          ${catLabel(cat1)}
        </span>
        <span class="cat-head-amt">${info.total.toLocaleString('ko-KR')}원 (${Math.round(info.total/total*100)}%)</span>
      </div>
      <div class="cat-row" style="margin-bottom:10px;">
        <div class="cat-row-label" style="font-weight:500;color:var(--text);">합계</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${pBar}%;background:${col};"></div></div>
        <div class="cat-row-amt">${info.total.toLocaleString('ko-KR')}원</div>
      </div>`;
    Object.entries(info.subs).sort((a,b)=>b[1]-a[1]).forEach(([sub,amt])=>{
      const sp = Math.round(amt/info.total*100);
      html += `<div class="cat-row">
        <div class="cat-row-label" title="${sub}">${sub}</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${sp}%;background:${SUB_COLOR[sub]||col};opacity:0.8;"></div></div>
        <div class="cat-row-amt">${amt.toLocaleString('ko-KR')}원</div>
      </div>`;
    });
    html += '</div>';
  });

  const vColor = pct>=70?'#2D6A4F':pct>=40?'#B5621A':'#B03030';
  const vBg    = pct>=70?'#E8F0EC':pct>=40?'#F8F0E4':'#F5E8E8';
  const vMsg   = pct>=70
    ? '이번 달은 가치관에 잘 맞는 소비를 했어요. 돈의 흐름이 당신의 방향과 일치하고 있습니다.'
    : pct>=40 ? '절반 정도는 가치관에 부합했어요. 다음 달엔 좀 더 의식적인 소비를 해볼 수 있을 것 같아요.'
    : '이번 달 소비를 다시 돌아볼 필요가 있어요. 어떤 부분이 달랐는지 메모를 살펴보세요.';

  html += `<div class="values-box">
    <div class="v-circle" style="background:${vBg};">
      <span class="v-pct" style="color:${vColor};">${pct}%</span>
      <span class="v-lbl">부합도</span>
    </div>
    <div class="v-text">
      <strong>가치관 부합도 ${pct}%</strong>
      ${vMsg}<br>
      <span style="font-size:11px;color:var(--text3);">${vc}건 / ${data.length}건 체크됨</span>
    </div>
  </div>`;

  document.getElementById('monthly-content').innerHTML = html;

  // AI 인사이트 카드를 DOM에 직접 추가 (innerHTML 이후에 붙여야 id 참조 가능)
  const insightCard = document.createElement('div');
  insightCard.className = 'ai-insight';
  insightCard.innerHTML = `
    <div class="ai-insight-header">
      <div class="ai-insight-title"><span>✦</span> 흐름 분석</div>
      <button class="btn-insight" id="btn-insight">AI 분석 요청</button>
    </div>
    <div id="insight-body"><div class="insight-empty">버튼을 누르면 이번 달 소비 패턴을 분석해드려요.</div></div>
  `;
  document.getElementById('monthly-content').appendChild(insightCard);
  document.getElementById('btn-insight').addEventListener('click', () => requestInsight(mk));

  // 파이 차트
  if (window._pieChart) { window._pieChart.destroy(); }
  const catKeys   = ['고정비','변동비','투자'].filter(c=>byCat[c]);
  const catAmts   = catKeys.map(c=>byCat[c].total);
  const catColors = catKeys.map(c=>catColor(c));
  const catLabels = catKeys.map(c=>catLabel(c));
  const ctx = document.getElementById('pie-chart');
  if (ctx) {
    window._pieChart = new Chart(ctx, {
      type: 'doughnut',
      data: { labels: catLabels, datasets: [{ data: catAmts, backgroundColor: catColors, borderWidth: 2, borderColor: '#FAFAF7', hoverOffset: 6 }] },
      options: {
        cutout: '58%',
        plugins: { legend: { display: false },
          tooltip: { callbacks: { label: c => ` ${c.label}: ${c.raw.toLocaleString('ko-KR')}원 (${Math.round(c.raw/total*100)}%)` } }
        },
        animation: { duration: 600, easing: 'easeInOutQuart' }
      }
    });
    const leg = document.getElementById('pie-legend');
    if (leg) leg.innerHTML = catKeys.map((c,i) => `
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:12px;height:12px;border-radius:50%;background:${catColors[i]};flex-shrink:0;"></div>
        <div>
          <div style="font-size:13px;font-weight:500;color:var(--text);">${catLabels[i]}</div>
          <div style="font-size:12px;color:var(--text3);">${catAmts[i].toLocaleString('ko-KR')}원 · ${Math.round(catAmts[i]/total*100)}%</div>
        </div>
      </div>`).join('');
  }
}


async function requestInsight(mk) {
  const btn  = document.getElementById('btn-insight');
  const body = document.getElementById('insight-body');
  if (!btn || !body) return;

  const data = entries.filter(function(e){ return getMonthKey(e.date) === mk; });
  if (!data.length) return;

  btn.disabled = true;
  btn.textContent = '분석 중...';
  body.innerHTML = '<div class="insight-loading"><div class="insight-dot"></div><div class="insight-dot"></div><div class="insight-dot"></div><span>소비 패턴을 분석하고 있어요</span></div>';

  var total  = data.reduce(function(s,e){ return s+e.amount; }, 0);
  var income = getMonthIncome(mk);
  var vc     = data.filter(function(e){ return e.values; }).length;
  var pct    = data.length ? Math.round(vc/data.length*100) : 0;

  var byCat = {};
  data.forEach(function(e) {
    if (!byCat[e.cat1]) byCat[e.cat1] = { total:0, subs:{}, items:[] };
    byCat[e.cat1].total += e.amount;
    byCat[e.cat1].subs[e.cat2] = (byCat[e.cat1].subs[e.cat2]||0) + e.amount;
    byCat[e.cat1].items.push({ desc:e.desc, amount:e.amount, values:e.values, memo:e.memo });
  });

  var catSummary = Object.entries(byCat).map(function(pair) {
    var cat = pair[0]; var info = pair[1];
    var subList = Object.entries(info.subs).map(function(p){ return p[0]+': '+p[1].toLocaleString()+'원'; }).join(', ');
    return '['+catLabel(cat)+'] 합계 '+info.total.toLocaleString()+'원\n  소분류: '+subList;
  }).join('\n');

  var itemList = data.map(function(e) {
    return '- '+e.date+' / '+catLabel(e.cat1)+' > '+e.cat2+' / '+e.desc+' / '+e.amount.toLocaleString()+'원 / 가치관부합:'+(e.values?'O':'X')+(e.memo?' / 메모:'+e.memo:'');
  }).join('\n');

  var incomeStr = income > 0
    ? '- 월 수입: '+income.toLocaleString()+'원 / 잔액: '+(income-total).toLocaleString()+'원 (지출 '+Math.round(total/income*100)+'%)'
    : '- 수입 미입력';

  var prompt = '아래는 사용자의 '+mk+' 가계부 데이터입니다.\n\n'
    + '【이달 요약】\n'
    + '- 총 지출: '+total.toLocaleString()+'원 ('+data.length+'건)\n'
    + incomeStr+'\n'
    + '- 가치관 부합률: '+pct+'% ('+vc+'/'+data.length+'건)\n\n'
    + '【대분류별 지출】\n'+catSummary+'\n\n'
    + '【전체 내역】\n'+itemList+'\n\n'
    + '---\n'
    + '이 가계부의 목적은 소비를 줄이기 위함이 아닙니다.\n'
    + '돈의 쓰임새와 흐름을 살펴보고, 본인의 가치관에 맞게 살고 있는지 점검하기 위함입니다.\n'
    + '물건소비·경험소비는 인적투자, 저축은 금융투자로 분류합니다.\n\n'
    + '아래 3가지 항목으로 분석해주세요. 반드시 JSON만 반환하고 다른 텍스트는 절대 포함하지 마세요.\n\n'
    + '{"good":"잘하고 있는 점 (2~3가지, 구체적 수치 포함, 100자 내외)","improve":"개선이 필요한 점 (2~3가지, 구체적 근거 포함, 100자 내외)","quote":"이달 소비를 보고 느낀 한마디 (따뜻하고 솔직하게, 50자 내외)"}';

  try {
    var res = await fetch('https://cashbook-proxy.roldeng-454.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    var result = await res.json();
    var text = result.content.map(function(b){ return b.text||''; }).join('').replace(/```json|```/g,'').trim();
    var parsed = JSON.parse(text);

    body.innerHTML =
      '<div class="insight-section insight-good">'
      + '<div class="insight-section-label">✓ 잘하고 있는 점</div>'
      + '<div class="insight-section-body">'+parsed.good+'</div>'
      + '</div>'
      + '<div class="insight-section insight-bad">'
      + '<div class="insight-section-label">△ 개선이 필요한 점</div>'
      + '<div class="insight-section-body">'+parsed.improve+'</div>'
      + '</div>'
      + '<div class="insight-section insight-quote">'
      + '<div class="insight-section-label">✦ 한마디</div>'
      + '<div class="insight-section-body">'+parsed.quote+'</div>'
      + '</div>';
  } catch(err) {
    body.innerHTML = '<div class="insight-empty">분석 중 오류가 발생했어요. 다시 시도해주세요.</div>';
    if (btn) { btn.disabled = false; btn.textContent = '다시 시도'; }
    return;
  }
  if (btn) { btn.disabled = false; btn.textContent = '다시 분석'; }
}



let calMonth = new Date();

function changeCalMonth(d) {
  calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth()+d, 1);
  renderCalendar();
}

function renderCalendar() {
  const y = calMonth.getFullYear();
  const m = calMonth.getMonth();
  document.getElementById('cal-title').textContent = y+'년 '+(m+1)+'월';

  // 날짜별 기록 집계
  const mk = y+'-'+String(m+1).padStart(2,'0');
  const dayMap = {};
  entries.filter(function(e){ return getMonthKey(e.date)===mk; }).forEach(function(e) {
    var d = e.date;
    if (!dayMap[d]) dayMap[d] = [];
    dayMap[d].push(e);
  });

  const today = new Date();
  const todayStr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');

  // 달력 첫날 / 마지막날
  const firstDay = new Date(y, m, 1);
  const lastDay  = new Date(y, m+1, 0);
  const startDow = firstDay.getDay(); // 0=일
  const totalDays = lastDay.getDate();

  const weekdays = ['일','월','화','수','목','금','토'];
  let html = '<div class="cal-grid">';
  weekdays.forEach(function(w){ html += '<div class="cal-weekday">'+w+'</div>'; });

  // 앞 빈칸 (이전 달)
  const prevLast = new Date(y, m, 0).getDate();
  for (var i = startDow-1; i >= 0; i--) {
    html += '<div class="cal-cell other-month"><div class="cal-date">'+(prevLast-i)+'</div></div>';
  }

  // 이번 달 날짜
  for (var day = 1; day <= totalDays; day++) {
    var dateStr = y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    var dow = new Date(y, m, day).getDay();
    var recs = dayMap[dateStr] || [];
    var hasRec = recs.length > 0;
    var isToday = dateStr === todayStr;
    var dowClass = dow===0?' sun':dow===6?' sat':'';
    var recClass = hasRec ? ' has-record' : '';
    var todayClass = isToday ? ' is-today' : '';

    html += '<div class="cal-cell'+dowClass+recClass+todayClass+'"'
      + (hasRec ? ' onclick="showCalPopup(\''+dateStr+'\')" title="'+recs.length+'건 기록"' : '')
      + '>';
    html += '<div class="cal-date">'+day+'</div>';

    if (hasRec) {
      // 카테고리별 컬러 점
      var dotHtml = '<div class="cal-dots">';
      recs.forEach(function(r) {
        dotHtml += '<div class="cal-dot-item" style="background:'+catColor(r.cat1)+';"></div>';
      });
      dotHtml += '</div>';
      html += dotHtml;
      // 합계 금액
      var dayTotal = recs.reduce(function(s,r){ return s+r.amount; }, 0);
      html += '<div class="cal-total">'+Math.round(dayTotal/1000)+'k</div>';
    }
    html += '</div>';
  }

  // 뒷 빈칸
  var remain = (7 - (startDow + totalDays) % 7) % 7;
  for (var i = 1; i <= remain; i++) {
    html += '<div class="cal-cell other-month"><div class="cal-date">'+i+'</div></div>';
  }
  html += '</div>';

  var calBody = document.getElementById('cal-body');
  calBody.innerHTML = html;

  // 기존 팝업 제거
  var old = document.getElementById('cal-popup');
  if (old) old.remove();
}

function showCalPopup(dateStr) {
  var old = document.getElementById('cal-popup');
  if (old) old.remove();

  var recs = entries.filter(function(e){ return e.date===dateStr; });
  if (!recs.length) return;

  var dt = new Date(dateStr+'T00:00:00');
  var label = dt.getFullYear()+'.'+String(dt.getMonth()+1).padStart(2,'0')+'.'+String(dt.getDate()).padStart(2,'0');
  var dayTotal = recs.reduce(function(s,r){ return s+r.amount; }, 0);

  var inner = recs.map(function(r) {
    return '<div class="cal-popup-item">'
      + '<div class="cal-popup-stripe" style="background:'+catColor(r.cat1)+';"></div>'
      + '<div class="cal-popup-info">'
      + '<div class="cal-popup-desc">'+r.desc+'</div>'
      + '<div class="cal-popup-sub">'+catLabel(r.cat1)+' › '+r.cat2+(r.values?' · ✓ 가치관 부합':'')+'</div>'
      + '</div>'
      + '<div class="cal-popup-amt">'+r.amount.toLocaleString('ko-KR')+'원</div>'
      + '</div>';
  }).join('');

  var popup = document.createElement('div');
  popup.id = 'cal-popup';
  popup.className = 'cal-popup';
  popup.innerHTML = '<div class="cal-popup-date"><span>'+label+' · '+recs.length+'건 · 합계 '+dayTotal.toLocaleString('ko-KR')+'원</span><button class="cal-popup-close" onclick="document.getElementById(\'cal-popup\').remove()">×</button></div>' + inner;
  document.getElementById('cal-body').appendChild(popup);
}

function exportCSV() {
  if (!entries.length) { showToast('내보낼 데이터가 없어요.'); return; }
  const fm = document.getElementById('filter-month').value;
  const fc = document.getElementById('filter-cat').value;
  let data = entries.filter(e=>(!fm||getMonthKey(e.date)===fm)&&(!fc||e.cat1===fc));
  const header = ['날짜','대분류','소분류','내용','금액','메모','가치관부합'];
  const rows = data.map(e=>[e.date,e.cat1,e.cat2,`"${e.desc}"`,e.amount,`"${e.memo||''}"`,e.values?'O':'X']);
  const csv = '\uFEFF' + [header,...rows].map(r=>r.join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download = `가계부_${fm||'전체'}.csv`;
  a.click();
  showToast('CSV 파일이 다운로드됩니다.');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
